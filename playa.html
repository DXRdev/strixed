<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>STRIXED</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Press+Start+2P&display=swap" rel="stylesheet">

<style>
/* ---------- BASE ---------- */
body {
  margin: 0;
  background: black;
  color: white;
  font-family: Arial, sans-serif;
  overflow-x: hidden;
}

body.locked {
  overflow: hidden;
}

h1 {
  font-family: "Press Start 2P", system-ui;
}

/* ---------- HEADER ---------- */
header img.banner {
  display: block;
  margin: 70px auto 20px;
  max-width: 90%;
  pointer-events: none;
}

/* ---------- HAMBURGER ---------- */
.top-left {
  position: fixed;
  top: 15px;
  left: 15px;
  z-index: 1100;
}

.hamburger {
  width: 30px;
  height: 22px;
  cursor: pointer;
  position: relative;
}

.hamburger span {
  position: absolute;
  height: 3px;
  width: 100%;
  background: white;
  transition: 0.3s ease;
}

.hamburger span:nth-child(1) { top: 0; }
.hamburger span:nth-child(2) { top: 9px; }
.hamburger span:nth-child(3) { top: 18px; }

.hamburger.active span:nth-child(1) {
  transform: rotate(45deg);
  top: 9px;
}

.hamburger.active span:nth-child(2) {
  opacity: 0;
}

.hamburger.active span:nth-child(3) {
  transform: rotate(-45deg);
  top: 9px;
}

/* ---------- SIDEBAR ---------- */
.sidebar {
  position: fixed;
  top: 0;
  left: 0;
  height: 100%;
  width: 260px;
  background: rgba(17,17,17,0.97);
  transform: translateX(-100%);
  transition: transform 0.3s ease;
  z-index: 1000;
  padding-top: 70px;
}

.sidebar.open {
  transform: translateX(0);
}

.sidebar h3 {
  font-family: "Press Start 2P";
  font-size: 12px;
  color: #aaa;
  margin: 20px 20px 8px;
}

.sidebar a {
  display: block;
  padding: 10px 20px;
  text-decoration: none;
  color: white;
  font-family: Inter, sans-serif;
  font-size: 16px;
}

.sidebar a:hover {
  background: #333;
}

/* Projects dropdown */
.sub-toggle {
  cursor: pointer;
}

.submenu {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.3s ease;
}

.submenu.open {
  max-height: 300px;
}

.locked-link {
  opacity: 0.4;
  pointer-events: none;
}

/* Overlay */
.overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  opacity: 0;
  pointer-events: none;
  transition: 0.3s;
  z-index: 900;
}

.overlay.active {
  opacity: 1;
  pointer-events: auto;
}

/* ---------- CAROUSEL ---------- */
.gallery {
  max-width: 800px;
  margin: 40px auto;
}

.carousel {
  overflow-x: auto;
  scroll-snap-type: x mandatory;
  scrollbar-width: none;
}
.carousel::-webkit-scrollbar { display: none; }

.slides {
  display: flex;
}

.slide {
  min-width: 100%;
  scroll-snap-align: center;
  text-align: center;
}

.slide img {
  width: 100%;
  max-height: 450px;
  object-fit: contain;
  border-radius: 8px;
}

.slide a {
  color: #69cfff;
  text-decoration: none;
}

.slide a:hover {
  color: #ff4d4d;
}

.dots {
  text-align: center;
  margin-top: 10px;
}

.dot {
  width: 10px;
  height: 10px;
  background: #555;
  border-radius: 50%;
  display: inline-block;
  margin: 0 4px;
}

.dot.active {
  background: white;
}
</style>
</head>

<body>

<div class="top-left">
  <div class="hamburger" id="hamburger">
    <span></span><span></span><span></span>
  </div>
</div>

<div class="sidebar" id="sidebar">
  <h3>MAIN</h3>
  <a href="/index">Home</a>
  <a href="/updates">Blogpost</a>
  <a href="/socials">Socials</a>

  <h3 class="sub-toggle" id="projectsToggle">PROJECTS ▾</h3>
  <div class="submenu" id="projectsMenu">
    <a href="/rifted">RIFTED</a>
    <a class="locked-link">???</a>
    <a href="/starbound">STARBOUND</a>
  </div>

  <h3>SITE</h3>
  <a href="/songoftheday">Song Of The Day</a>
  <a class="locked-link">???</a>
</div>

<div class="overlay" id="overlay"></div>

<header>
  <img class="banner" loading="lazy" src="https://i.imgur.com/7yo4ycF.png">
</header>

<h1>elastrixx</h1>
<h2>professional girlfailure and novice gamedev</h2>

<section class="gallery">
  <div class="carousel" id="carousel">
    <div class="slides">
      <div class="slide">
        <img loading="lazy" src="https://i.imgur.com/98EJWYG_d.webp">
        <p><a href="https://www.fortnite.com/@dxrdev/7006-0547-9691" target="_blank">MEGA GUN GAME (UEFN)</a></p>
      </div>
      <div class="slide">
        <img loading="lazy" src="https://i.imgur.com/hCN1xUG.jpeg">
        <p><a href="/starbound">STARBOUND</a></p>
      </div>
      <div class="slide">
        <img loading="lazy" src="https://i.imgur.com/ucS0p5N.jpeg">
        <p><a href="/rifted">RIFTED</a></p>
      </div>
      <div class="slide">
        <img loading="lazy" src="https://i.imgur.com/ucS0p5N.jpeg">
        <p><a href="/forbidden">COMING SOON</a></p>
      </div>
    </div>
  </div>
  <div class="dots" id="dots"></div>
</section>

<script>
/* Sidebar */
const hamburger = document.getElementById("hamburger");
const sidebar = document.getElementById("sidebar");
const overlay = document.getElementById("overlay");

function closeSidebar() {
  sidebar.classList.remove("open");
  hamburger.classList.remove("active");
  overlay.classList.remove("active");
  document.body.classList.remove("locked");
}

hamburger.onclick = () => {
  sidebar.classList.toggle("open");
  hamburger.classList.toggle("active");
  overlay.classList.toggle("active");
  document.body.classList.toggle("locked");
};

overlay.onclick = closeSidebar;

/* Projects submenu */
document.getElementById("projectsToggle").onclick = () => {
  document.getElementById("projectsMenu").classList.toggle("open");
};

/* Carousel */
const carousel = document.getElementById("carousel");
const slides = document.querySelectorAll(".slide");
const dotsContainer = document.getElementById("dots");

let index = 0;
let auto = true;
let timer;

slides.forEach(() => {
  const d = document.createElement("span");
  d.className = "dot";
  dotsContainer.appendChild(d);
});
const dots = document.querySelectorAll(".dot");

function updateDots() {
  dots.forEach(d => d.classList.remove("active"));
  dots[index].classList.add("active");
}
updateDots();

setInterval(() => {
  if (!auto) return;
  index = (index + 1) % slides.length;
  carousel.scrollTo({ left: index * carousel.clientWidth, behavior: "smooth" });
  updateDots();
}, 5000);

carousel.addEventListener("scroll", () => {
  auto = false;
  clearTimeout(timer);
  index = Math.round(carousel.scrollLeft / carousel.clientWidth);
  updateDots();
  timer = setTimeout(() => auto = true, 4000);
});
</script>

</body>
</html>
