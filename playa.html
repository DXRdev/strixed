<html lang="en">  
<head>  
  <meta charset="UTF-8">  
  <title>STRIXED</title>  
  <meta name="viewport" content="width=device-width, initial-scale=1.0">  

  <!-- Favicon -->  
  <link href="data:image/x-icon;base64,AAABAAEAEBAQAAEABAAoAQAAFgAAACgAAAAQAAAAIAAAAAEABAAAAAAAgAAAAAAAAAAAAAAAEAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAD//wAA+T8AAPt/AACGfwAAe78AAL3fAADe7wAA728AAPfvAAD77wAA/fcAAP23AAD9VwAA/fcAAP7vAAD/HwAA" rel="icon" type="image/x-icon">  

  <!-- Fonts -->  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;500;700&display=swap" rel="stylesheet">  
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">  

  <!-- External CSS -->  
  <link rel="stylesheet" href="style.css">  

  <style>  
    body {  
      font-family: "Press Start 2P", system-ui;  
      margin: 0;  
      background: black;  
      color: white;  
      transition: background 0.3s, color 0.3s;
    }  

    img.banner { max-width: 90%; height: auto; }  
    video { max-width: 100%; height: auto; display: block; margin: 0 auto; }  
    .about-section, .notice { padding: 0 15px; }  

    .container { display: flex; align-items: center; justify-content: center; }  
    img { max-width: 100%; max-height: 100%; }  

    .about-title { font-family: 'Inter', sans-serif; font-weight: 400; color: white; text-align: center; margin-bottom: 1em; }  
    .about-section { font-family: 'Inter', sans-serif; font-size: 18px; font-weight: 500; color: white; text-align: center; line-height: 1.6; max-width: 800px; margin: 0 auto; }  

    p { margin-bottom: 1em; }  
    .text { font-size: 20px; padding-left: 20px; }  
    .notice { font-family: 'Inter', sans-serif; font-size: 20px; color: #ff4d4d; text-align: center; margin: 10px auto 20px; max-width: 800px; line-height: 1.4; }  

    p.beeg { font-size: 30px; }  

    /* Sidebar */  
    .sidebar {  
      height: 100%; width: 0; position: fixed; top: 0; left: 0;  
      background-color: rgba(17, 17, 17, 0.95);  
      overflow-x: hidden; transition: 0.3s; padding-top: 60px; z-index: 1000;  
    }  
    .sidebar a { padding: 10px 20px; text-decoration: none; font-size: 18px; font-family: 'Inter', sans-serif; color: #f1f1f1; display: block; transition: 0.2s; }  
    .sidebar a:hover { background: #575757; }  
    .sidebar h3 { color: #bbb; margin: 20px 16px 8px; font-size: 14px; text-transform: uppercase; }  
    .sidebar .closebtn { position: absolute; top: 10px; right: 20px; font-size: 36px; color: #fff; }  

    .top-left { position: fixed; top: 10px; left: 10px; display: flex; align-items: center; gap: 10px; z-index: 1100; }  
    .openbtn { font-size: 24px; cursor: pointer; background: none; border: none; color: white; }  
    header img.banner { display: block; margin: 60px auto 20px; }  

    /* --- Gallery styles --- */
    .gallery { max-width: 800px; margin: 40px auto; overflow: hidden; border-radius: 12px; }
    .carousel { position: relative; width: 100%; }
    .slides { display: flex; width: 300%; transition: transform 0.5s ease-in-out; }
    .slide { width: 100%; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; }
    .slide img { width: 100%; height: auto; max-height: 450px; object-fit: contain; border-radius: 8px; display: block; }
    .slide p { margin: 10px 0 20px; font-size: 16px; font-family: 'Inter', sans-serif; }
    .slide a { color: #69cfff; text-decoration: none; font-weight: 500; }
    .slide a:hover { color: #ff4d4d; }

    /* Settings dropdown */
    .top-right { position: fixed; top: 10px; right: 10px; z-index: 1100; }
    .settings-btn { font-size: 20px; cursor: pointer; background: none; border: none; color: white; }
    .settings-menu { 
      display: none; 
      position: absolute; right: 0; top: 40px; 
      background: rgba(30,30,30,0.95); 
      border-radius: 8px; 
      min-width: 180px; 
      font-family: 'Inter', sans-serif; 
    }
    .settings-menu a { display: block; padding: 10px 15px; color: #f1f1f1; text-decoration: none; font-size: 14px; }
    .settings-menu a:hover { background: #575757; }

    /* Dark mode */
    body.dark { background: #111; color: #eee; }

    /* Evil mode */
    body.evil { filter: invert(1) hue-rotate(180deg); }
  </style>  
</head>  

<body>  
  <!-- Sidebar -->  
  <div id="mySidebar" class="sidebar">  
    <a href="javascript:void(0)" class="closebtn" onclick="toggleSidebar()">&times;</a>  
    <h3>Main</h3>  
    <a href="/">Home</a>
    <a href="/about">About</a>
    <a href="/socials">Socials</a>
    <a href="/diary">Blogpost (Coming soon)</a>  
    <h3>Site</h3>  
    <a href="/riftedwiki">Rifted Wiki (Coming Soon)</a>  
    <a href="/space">[C:]</a>  
  </div>  

  <!-- Top left controls -->
  <div class="top-left">  
    <button class="openbtn" onclick="toggleSidebar()">☰</button>  
    <a href="/"><img src="https://i.imgur.com/1NaqL9Z.png" alt="Home" width="35" height="40"></a>  
  </div>  

  <!-- Top right settings -->
  <div class="top-right">
    <button class="settings-btn" onclick="toggleSettings()">⚙️</button>
    <div class="settings-menu" id="settingsMenu">
      <a href="javascript:void(0)" onclick="toggleSidebarMode()">Sidebar Animations: <span id="sidebarModeLabel">OFF</span></a>
      <a href="javascript:void(0)" onclick="toggleDarkMode()">🌙 Dark Mode</a>
      <a href="javascript:void(0)" onclick="toggleEvilMode()">😈 Evil Mode</a>
    </div>
  </div>

  <!-- Banner -->
  <header>  
    <a href="/"><img class="banner" width="600" height="150" src="https://i.imgur.com/7yo4ycF.png" alt="Banner" /></a>  
  </header>  

  <!-- Existing content continues... -->
  <!-- NOTICE, HEADERS, GALLERY, ABOUT, etc. (unchanged) -->

  <script>
    const sidebar = document.getElementById("mySidebar");
    const topLeft = document.querySelector(".top-left");
    const openBtn = document.querySelector(".openbtn");
    const settingsMenu = document.getElementById("settingsMenu");
    let sidebarClean = false; // OFF by default

    // Sidebar modes
    function applySidebarMode() {
      if (sidebarClean) {
        sidebar.style.width = "250px";
        sidebar.style.transform = "translateX(-250px)";
        sidebar.style.transition = "transform 0.3s";
      } else {
        sidebar.style.width = "0";
        sidebar.style.transition = "width 0.3s";
        sidebar.style.transform = "none";
      }
    }
    function toggleSidebarMode() {
      sidebarClean = !sidebarClean;
      document.getElementById("sidebarModeLabel").innerText = sidebarClean ? "ON" : "OFF";
      applySidebarMode();
    }

    // Sidebar open/close
    function openSidebar() {
      if (sidebarClean) {
        sidebar.classList.add("open");
        sidebar.style.transform = "translateX(0)";
      } else {
        sidebar.style.width = "250px";
      }
      if (topLeft) topLeft.style.display = "none";
      document.addEventListener("click", outsideClickListener);
    }
    function closeSidebar() {
      if (sidebarClean) {
        sidebar.style.transform = "translateX(-250px)";
      } else {
        sidebar.style.width = "0";
      }
      if (topLeft) topLeft.style.display = "flex";
      document.removeEventListener("click", outsideClickListener);
    }
    function toggleSidebar() {
      if ((!sidebarClean && sidebar.style.width === "250px") || 
          (sidebarClean && sidebar.style.transform === "translateX(0px)")) {
        closeSidebar();
      } else {
        openSidebar();
      }
    }
    function outsideClickListener(e) {
      if (!sidebar.contains(e.target) && !openBtn.contains(e.target)) {
        closeSidebar();
      }
      if (!settingsMenu.contains(e.target) && !e.target.closest(".settings-btn")) {
        settingsMenu.style.display = "none";
      }
    }

    // Close sidebar on link click
    sidebar.querySelectorAll("a").forEach(link => {
      link.addEventListener("click", () => closeSidebar());
    });

    // Settings dropdown
    function toggleSettings() {
      settingsMenu.style.display = settingsMenu.style.display === "block" ? "none" : "block";
    }

    // Dark mode
    function toggleDarkMode() {
      document.body.classList.toggle("dark");
    }

    // Evil mode
    function toggleEvilMode() {
      document.body.classList.toggle("evil");
    }

    // Carousel
    (function initCarousel(){
      const slidesContainer = document.querySelector(".slides");
      const slideElems = document.querySelectorAll(".slide");
      if (!slidesContainer || slideElems.length === 0) return;

      const total = slideElems.length;
      slidesContainer.style.width = (total * 100) + "%";
      slideElems.forEach(s => s.style.width = (100 / total) + "%");

      let index = 0;
      setInterval(() => {
        index = (index + 1) % total;
        slidesContainer.style.transform = `translateX(-${index * (100 / total)}%)`;
      }, 5000);
    })();
  </script>
</body>  
</html>
