<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Wiki</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background-color: #2b2b2b; /* modern gray */
      color: #ffffff; /* white text */
      line-height: 1.6;
    }

    header {
      background: #3c3c3c;
      padding: 20px;
      text-align: center;
      font-size: 24px;
      font-weight: bold;
    }

    main {
      padding: 20px;
      max-width: 900px;
      margin: auto;
    }

    h1, h2, h3 {
      color: #ffffff;
      margin-top: 20px;
    }

    a {
      color: #66b3ff; /* nice link blue */
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    .page-list {
      margin-top: 20px;
      background: #383838;
      padding: 15px;
      border-radius: 6px;
    }

    .page-list ul {
      list-style: none;
      padding: 0;
    }

    .page-list li {
      margin: 8px 0;
    }
  </style>
</head>
<body>
  <header>
    Rifted Wiki
  </header>

  <main>
    <h1>Welcome to the Rifted Wiki</h1>
    <p>This wiki contains various pages of info. Which currently youre not supposed to see, nor be on here, but whatever. Browse below:</p>

    <div class="page-list">
      <h2>Available Pages</h2>
      <ul>
        <li><a href="elina.html">Elina</a></li>
        <li><a href="scrapped_sprite.html">Scrapped Sprite</a></li>
        <li><a href="anotherpage.html">Another Page</a></li>
      </ul>
    </div>
  </main>
</body>
</html>
