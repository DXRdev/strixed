<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>UPDATING...</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  :root {
    --progress: 0%;
  }

  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: black;
    color: white;
    font-family: monospace;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .wrapper {
    width: min(80vw, 420px);
    text-align: center;
  }
  
  .bar {
    width: 100%;
    height: 10px;
    background: rgba(255,255,255,0.15);
    border-radius: 6px;
    overflow: hidden;
    margin-bottom: 20px;
  }
  
  .bar-fill {
    width: var(--progress);
    height: 100%;
    background: white;
    border-radius: 6px;
    transition: width 0.6s ease;
  }

  .status {
    font-size: clamp(10px, 3vw, 18px);
    letter-spacing: 2px;
  }

  .timer {
    margin-top: 10px;
    font-size: clamp(9px, 2.5vw, 14px);
    opacity: 0.75;
    letter-spacing: 1px;
  }

  .dots {
    display: inline-block;
    width: 24px;
    text-align: left;
  }
</style>
</head>

<body>

<div class="wrapper">
  <div class="bar">
    <div class="bar-fill"></div>
  </div>
  
  <div class="status">
    SYSTEM REBOOT FINISHED: UPDATING FILES<span class="dots"></span>
  </div>
<!-- Woah, this place looks even weirder! Hmm...-->

<!-- What the? Are these portals? Wait, that's the city! -->
<!-- Alright Me. Portal... i'll trust in you! -->
<!-- @: PROJECT "LUMENHARDT" WAS UPDATED. -->
  <div class="timer" id="timer">
    INITIALIZING TIME SYNC
  </div>
</div>

<script>
  const dotsEl = document.querySelector(".dots");
  let count = 0;
  setInterval(() => {
    count = (count + 1) % 4;
    dotsEl.textContent = ".".repeat(count);
  }, 500);

  const root = document.documentElement;
  const timerEl = document.getElementById("timer");

  const targetDate = new Date("2026-01-10T00:00:00-06:00");

  const startDate = new Date("2026-01-01T00:00:00-06:00");

  const totalHours = Math.floor((targetDate - startDate) / 36e5);

  function updateTimerAndProgress() {
    const now = new Date();

    const remainingMs = targetDate - now;
    const remainingHours = Math.max(0, Math.floor(remainingMs / 36e5));

    const elapsedHours = Math.min(
      totalHours,
      Math.max(0, totalHours - remainingHours)
    );

    const percent = Math.floor((elapsedHours / totalHours) * 100);
    root.style.setProperty("--progress", percent + "%");

    if (remainingMs <= 0) {
      timerEl.textContent = "DATA SYNC COMPLETE";
      root.style.setProperty("--progress", "100%");
      return;
    }

    const days = Math.floor(remainingHours / 24);
    const hours = remainingHours % 24;

    timerEl.textContent =
      `TIME REMAINING: ${days}D ${hours}H`;
  }

  updateTimerAndProgress();
  setInterval(updateTimerAndProgress, 60 * 60 * 1000);
</script>

</body>
</html>
