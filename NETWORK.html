<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Connecting</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  :root {
    --progress: 39%;
  }

  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: black;
    color: white;
    font-family: monospace;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .wrapper {
    width: min(80vw, 420px);
    text-align: center;
  }
  
  .bar {
    width: 100%;
    height: 10px;
    background: rgba(255,255,255,0.15);
    border-radius: 6px;
    overflow: hidden;
    margin-bottom: 20px;
  }
  
  .bar-fill {
    width: var(--progress);
    height: 100%;
    background: white;
    border-radius: 6px;
  }

  .status {
    font-size: clamp(10px, 3vw, 18px);
    letter-spacing: 2px;
  }

  .dots {
    display: inline-block;
    width: 24px;
    text-align: left;
  }
</style>
</head>

<body>

<div class="wrapper">
  <div class="bar">
    <div class="bar-fill"></div>
  </div>
  
  <div class="status">
    CONNECTED: RECEIVING MESSAGE(S)<span class="dots"></span>
  </div>
</div>

<script>
  const dotsEl = document.querySelector(".dots");
  let count = 0;
  
  setInterval(() => {
    count = (count + 1) % 4;
    dotsEl.textContent = ".".repeat(count);
  }, 500);
</script>

</body>
</html>
