<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Your Website</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f8f8f8;
    }

    /* Sidebar */
    .sidebar {
      position: fixed;
      left: 0;
      top: 0;
      bottom: 0;
      width: 200px;
      background: #111;
      color: #fff;
      padding-top: 20px;
      text-align: center;
    }
    .sidebar a {
      display: block;
      padding: 12px;
      color: #fff;
      text-decoration: none;
    }
    .sidebar a:hover {
      background: #333;
    }

    /* Main content area */
    .content {
      margin-left: 200px;
      padding: 20px;
    }

    h1, h2 {
      margin: 20px 0 10px;
    }

    .separator {
      margin: 40px auto 20px;
      text-align: center;
      position: relative;
      font-weight: bold;
    }
    .separator:before,
    .separator:after {
      content: "";
      position: absolute;
      top: 50%;
      width: 40%;
      height: 1px;
      background: #000;
    }
    .separator:before {
      left: 0;
    }
    .separator:after {
      right: 0;
    }

    /* Carousel */
    .carousel-container {
      position: relative;
      max-width: 600px;
      margin: 0 auto;
      overflow: hidden;
      border-radius: 8px;
      background: #fff;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    .carousel-track {
      display: flex;
      transition: transform 0.4s ease-in-out;
    }
    .carousel-item {
      min-width: 100%;
      box-sizing: border-box;
      text-align: center;
    }
    .carousel-item img {
      width: 100%;
      display: block;
    }
    .carousel-caption {
      padding: 10px;
      font-size: 14px;
      background: #fafafa;
      border-top: 1px solid #ddd;
    }

    /* Arrows */
    .carousel-button {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(0,0,0,0.5);
      border: none;
      color: #fff;
      padding: 10px;
      cursor: pointer;
      border-radius: 50%;
      z-index: 10;
    }
    .carousel-button.left {
      left: 10px;
    }
    .carousel-button.right {
      right: 10px;
    }
    .carousel-button:hover {
      background: rgba(0,0,0,0.7);
    }
  </style>
</head>
<body>
  <div class="sidebar">
    <a href="#about">ABOUT</a>
    <a href="#socials">SOCIALS</a>
    <a href="#projects">PROJECTS</a>
  </div>

  <div class="content">
    <h1>Welcome to My Page</h1>
    <p>Some intro text here.</p>

    <div id="about" class="separator">ABOUT</div>
    <p>This is the about section...</p>

    <div id="socials" class="separator">SOCIALS</div>
    <p>Links to socials go here...</p>

    <div id="projects" class="separator">PROJECTS</div>

    <!-- Carousel -->
    <div class="carousel-container">
      <button class="carousel-button left">&#10094;</button>
      <div class="carousel-track">
        <div class="carousel-item">
          <img src="https://via.placeholder.com/600x300/ff7f7f/fff?text=Project+1" alt="Project 1">
          <div class="carousel-caption"><a href="#">Project 1</a></div>
        </div>
        <div class="carousel-item">
          <img src="https://via.placeholder.com/600x300/7fbfff/fff?text=Project+2" alt="Project 2">
          <div class="carousel-caption"><a href="#">Project 2</a></div>
        </div>
        <div class="carousel-item">
          <img src="https://via.placeholder.com/600x300/7fff7f/fff?text=Project+3" alt="Project 3">
          <div class="carousel-caption"><a href="#">Project 3</a></div>
        </div>
      </div>
      <button class="carousel-button right">&#10095;</button>
    </div>
  </div>

  <script>
    const track = document.querySelector('.carousel-track');
    const items = document.querySelectorAll('.carousel-item');
    const prevButton = document.querySelector('.carousel-button.left');
    const nextButton = document.querySelector('.carousel-button.right');
    let index = 0;

    function updateCarousel() {
      track.style.transform = `translateX(${-index * 100}%)`;
    }

    nextButton.addEventListener('click', () => {
      index = (index + 1) % items.length;
      updateCarousel();
    });

    prevButton.addEventListener('click', () => {
      index = (index - 1 + items.length) % items.length;
      updateCarousel();
    });

    // Swipe for mobile
    let startX = 0;
    track.addEventListener('touchstart', e => {
      startX = e.touches[0].clientX;
    });
    track.addEventListener('touchend', e => {
      let endX = e.changedTouches[0].clientX;
      if (startX - endX > 50) {
        index = (index + 1) % items.length;
        updateCarousel();
      } else if (endX - startX > 50) {
        index = (index - 1 + items.length) % items.length;
        updateCarousel();
      }
    });
  </script>
</body>
</html>
