<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Elaina</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background-color: black;
      color: white;
      text-align: center;
    }

    .container {
      margin-left: 200px; /* for sidebar */
      padding: 20px;
    }

    /* Sidebar */
    .sidebar {
      position: fixed;
      top: 0;
      left: 0;
      width: 200px;
      height: 100%;
      background-color: #111;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 20px;
    }

    .sidebar h2 {
      color: white;
      margin-bottom: 30px;
    }

    .sidebar a {
      color: white;
      text-decoration: none;
      margin: 10px 0;
    }

    .sidebar a:hover {
      text-decoration: underline;
    }

    /* Section separators */
    h2 {
      border-bottom: 1px solid #555;
      padding-bottom: 5px;
      margin-top: 50px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    /* Carousel wrapper */
    .carousel-container {
      position: relative;
      max-width: 800px;
      margin: 30px auto;
      overflow: hidden;
      border-radius: 10px;
    }

    .carousel {
      display: flex;
      transition: transform 0.5s ease-in-out;
    }

    .carousel img {
      width: 100%;
      flex-shrink: 0;
      border-radius: 10px;
    }

    /* Captions below */
    .captions {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 10px;
      flex-wrap: wrap;
    }

    .captions div {
      text-align: center;
    }

    .captions a {
      color: #00bfff;
      text-decoration: none;
    }

    .captions a:hover {
      text-decoration: underline;
    }

    /* Arrows */
    .arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background-color: rgba(0,0,0,0.5);
      color: white;
      border: none;
      font-size: 24px;
      cursor: pointer;
      padding: 10px;
      border-radius: 50%;
      z-index: 10;
    }

    .arrow.left {
      left: 10px;
    }

    .arrow.right {
      right: 10px;
    }

    @media (max-width: 600px) {
      .container {
        margin-left: 0;
      }
      .sidebar {
        position: static;
        width: 100%;
        height: auto;
        flex-direction: row;
        justify-content: center;
      }
      .sidebar h2 {
        display: none;
      }
    }
  </style>
</head>
<body>
  <!-- Sidebar -->
  <div class="sidebar">
    <h2>Menu</h2>
    <a href="#about">About</a>
    <a href="#projects">Projects</a>
    <a href="#socials">Socials</a>
  </div>

  <div class="container">
    <h1>Welcome to Elaina’s Site</h1>
    <p>This is my cozy pink-coded place 💖</p>

    <h2 id="about">About</h2>
    <p>I’m Elaina, the Goddess of Souls ✨</p>

    <!-- Projects Section -->
    <h2 id="projects">Projects</h2>
    <div class="carousel-container">
      <button class="arrow left" onclick="moveSlide(-1)">&#10094;</button>
      <div class="carousel" id="carousel">
        <img src="https://via.placeholder.com/800x400?text=Project+1" alt="Project 1" />
        <img src="https://via.placeholder.com/800x400?text=Project+2" alt="Project 2" />
        <img src="https://via.placeholder.com/800x400?text=Project+3" alt="Project 3" />
      </div>
      <button class="arrow right" onclick="moveSlide(1)">&#10095;</button>
    </div>
    <div class="captions">
      <div>Project 1<br><a href="#">View More</a></div>
      <div>Project 2<br><a href="#">View More</a></div>
      <div>Project 3<br><a href="#">View More</a></div>
    </div>

    <h2 id="socials">Socials</h2>
    <p>Find me online 🌸</p>
  </div>

  <script>
    let index = 0;
    function moveSlide(step) {
      const carousel = document.getElementById("carousel");
      const totalSlides = carousel.children.length;
      index = (index + step + totalSlides) % totalSlides;
      carousel.style.transform = `translateX(-${index * 100}%)`;
    }
  </script>
</body>
</html>
