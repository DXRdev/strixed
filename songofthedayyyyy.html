<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Song of the Day | STRIXED</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Comic+Sans+MS&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Inter', sans-serif;
      margin: 0;
      background: black;
      color: white;
    }

    .top-left, .top-right, .sidebar {
      position: fixed;
      z-index: 1000;
    }

    /* "graphic design is my passion" header */
    .title {
      text-align: center;
      font-family: 'Comic Sans MS', cursive;
      font-size: 40px;
      background: linear-gradient(90deg, red, orange, yellow, green, cyan, blue, violet);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 2px 2px 3px rgba(255,255,255,0.5);
      margin-top: 100px;
      margin-bottom: 50px;
      letter-spacing: 2px;
      animation: rainbow 6s linear infinite;
    }
    @keyframes rainbow {
      0% {filter: hue-rotate(0deg);}
      100% {filter: hue-rotate(360deg);}
    }

    .song-container {
      text-align: center;
      font-family: 'Inter', sans-serif;
    }

    iframe {
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(255,255,255,0.1);
      margin-bottom: 40px;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    /* Sidebar system */
    .sidebar {
      height: 100%;
      width: 0;
      top: 0;
      left: 0;
      background-color: rgba(17, 17, 17, 0.95);
      overflow-x: hidden;
      transition: 0.3s;
      padding-top: 60px;
    }
    .sidebar a {
      padding: 10px 20px;
      display: block;
      color: #fff;
      text-decoration: none;
      font-size: 18px;
    }
    .sidebar a:hover { background: #575757; }

    .openbtn {
      font-size: 24px;
      cursor: pointer;
      background: none;
      border: none;
      color: white;
    }
    .top-left { top: 10px; left: 10px; display: flex; gap: 10px; align-items: center; }
    .top-right { top: 10px; right: 10px; }
  </style>
</head>

<body>
  <!-- Sidebar -->
  <div id="mySidebar" class="sidebar">
    <a href="javascript:void(0)" onclick="toggleSidebar()">&times; Close</a>
    <a href="/">Home</a>
    <a href="/about">About</a>
    <a href="/socials">Socials</a>
    <a href="/diary">Blog</a>
  </div>

  <!-- Top Left -->
  <div class="top-left">
    <button class="openbtn" onclick="toggleSidebar()">☰</button>
    <a href="/"><img src="https://i.imgur.com/1NaqL9Z.png" alt="Home" width="35" height="40"></a>
  </div>

  <!-- Title -->
  <h1 class="title">SONG OF THE DAY</h1>

  <!-- Song Embed -->
  <div class="song-container">
    <iframe style="border-radius:12px" 
      src="https://open.spotify.com/embed/track/0ECs7wpW9157Tk5yBUGbE0?utm_source=generator"
      width="300" height="380" frameBorder="0"
      allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
      loading="lazy"></iframe>
  </div>

  <script>
    function toggleSidebar() {
      const sidebar = document.getElementById("mySidebar");
      sidebar.style.width = (sidebar.style.width === "250px") ? "0" : "250px";
    }
  </script>
</body>
</html>
