<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Song of the Day</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      background: #fefefe;
      text-align: center;
      font-family: Comic Sans MS, Papyrus, cursive; /* cursed font combo */
    }

    h1 {
      font-size: 48px;
      font-weight: bold;
      background: linear-gradient(to right, red, orange, yellow, green, blue, indigo, violet);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
      margin-top: 40px;
      margin-bottom: 20px;
    }

    .song-section {
      margin-top: 20px;
    }

    .song-cover {
      width: 300px;
      border: 5px solid hotpink;
      border-radius: 15px;
      box-shadow: 5px 5px 15px rgba(0,0,0,0.3);
    }

    .song-title {
      font-size: 28px;
      margin-top: 10px;
      color: #444;
    }

    .song-artist {
      font-size: 22px;
      margin-top: 5px;
      color: #666;
    }

    a {
      text-decoration: none;
    }
  </style>
</head>
<body>

  <h1>Song of the Day</h1>

  <div class="song-section">
    <a href="https://open.spotify.com/album/7ycBtnsMtyVbbwTfJwRjSP" target="_blank">
      <img src="https://upload.wikimedia.org/wikipedia/en/9/9c/To_Pimp_a_Butterfly.png" 
           alt="To Pimp a Butterfly" 
           class="song-cover">
      <div class="song-title">To Pimp a Butterfly</div>
      <div class="song-artist">Kendrick Lamar</div>
    </a>
  </div>

</body>
</html>
