<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>?</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      height: 100vh;
      background-color: black;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .question {
      color: white;
      font-size: 200px;
      font-family: 'Courier New', monospace;
      animation: float 4s ease-in-out infinite;
      user-select: none;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-20px); }
    }
  </style>
</head>
<body>
  <div class="question">?</div>

  <audio id="ominous" autoplay loop>
    <source src="AUDIO_URL_HERE.mp3" type="audio/mpeg">
  </audio>

  <script>
    const audio = document.getElementById('ominous');
    // You can set the default volume here (0.0 to 1.0)
    audio.volume = 0.3; // 30% volume

    // Some browsers block autoplay until the user interacts.
    // This makes it start once the user clicks anywhere.
    document.body.addEventListener('click', () => {
      audio.play();
    }, { once: true });
  </script>
</body>
</html>
