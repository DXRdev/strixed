<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>files</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      height: 100vh;
      background-color: #001100;
      color: #00ff00;
      font-family: monospace;
      overflow: hidden;
    }
    #path {
      position: absolute;
      top: 10px;
      left: 20px;
      font-size: 18px;
      color: #00ff00;
      pointer-events: none;
    }
    #loading-screen {
      position: fixed;
      inset: 0;
      background: black;
      color: #00ff00;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-size: 18px;
      z-index: 9999;
    }
    #desktop {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      justify-items: center;
      align-items: start;
      gap: 60px;
      padding: 40px;
    }
    .folder, .document {
      text-align: center;
      cursor: pointer;
      margin: 0;
    }
    .folder img, .document img {
      width: 100px;
      height: 100px;
      display: block;
      margin: 0 auto;
    }
    .folder span, .document span {
      display: block;
      margin-top: 10px;
      font-size: 15px;
      color: #00ff00;
    }
  </style>
</head>
<body>
  <div id="loading-screen">
    <p>LOADING SYSTEM...</p>
    <p id="progress">0%</p>
  </div>

  <div id="desktop">
    <div id="path">C://USERS/SILVERONE</div>
    <div class="folder" onclick="openFolder('/files/user/silverone/work')">
      <img src="https://i.imgur.com/9Ml0l4F.png">
      <span>work</span>
    </div>
    <div class="folder" onclick="openFolder('/files/user/silverone/personal')">
      <img src="https://i.imgur.com/9Ml0l4F.png">
      <span>personal</span>
    </div>
    <div class="folder" onclick="openFolder('/files/user/silverone/monthly_reports')">
      <img src="https://i.imgur.com/4NcVCjW.png">
      <span>monthly_reports</span>
    </div>
    <div class="folder" onclick="openFolder('/files/user/silverone/member_research')">
      <img src="https://i.imgur.com/4NcVCjW.png">
      <span>member_research</span>
    </div>
    <div class="folder" onclick="openFolder('/files/user/silverone/homework')">
      <img src="https://i.imgur.com/4NcVCjW.png">
      <span>homework</span>
    </div>
    <div class="folder" onclick="openFolder('/files/user/silverone/member_research(1)')">
      <img src="https://i.imgur.com/H9mV2WD.png">
      <span>member_research(1)</span>
    </div>
  </div>

  <script>
    const loadingScreen = document.getElementById("loading-screen");
    const progressText = document.getElementById("progress");
    const desktop = document.getElementById("desktop");

    function jitterLoad() {
      let percent = 0;
      const totalTime = 3000 + Math.random() * 1600;
      const start = Date.now();
      const interval = setInterval(() => {
        const elapsed = Date.now() - start;
        percent = Math.min(100, Math.floor((elapsed / totalTime) * 100));
        progressText.textContent = percent + "%";
        if (percent >= 100) {
          clearInterval(interval);
          setTimeout(() => {
            loadingScreen.style.display = "none";
            desktop.style.display = "grid";
          }, 120);
        }
      }, 100);
    }
    jitterLoad();

    function openFolder(path) {
      window.location.href = path;
    }
  </script>
</body>
</html>
