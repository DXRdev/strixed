<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>files</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    #path { position: absolute; top: 10px; left: 20px; font-size: 18px; color: #00ff00; font-family: monospace; pointer-events: none; }
    body { margin:0; height:100vh; background:#001100; color:#00ff00; font-family:monospace; overflow:hidden; }
    #loading-screen { position: fixed; inset:0; background:#000; color:#00ff00; display:flex; flex-direction:column; justify-content:center; align-items:center; font-size:18px; z-index:9999; }
    #loading-screen p.small { margin:4px 0 0 0; font-size:12px; color:#66ff66; }
    #desktop { display:grid; grid-template-columns:repeat(3,1fr); gap:60px; padding:40px; justify-items:center; align-items:start; visibility:hidden; }
    .folder,.document{ text-align:center; cursor:pointer; margin:0; }
    .folder img,.document img{ width:100px;height:100px;display:block;margin:0 auto;}
    .folder span,.document span{ display:block; margin-top:10px; font-size:15px; color:#00ff00; }
    #passwordOverlay{ display:none; position:fixed; inset:0; background:rgba(0,0,0,0.85); justify-content:center; align-items:center; z-index:10000; }
    #passwordBox{ background:white; color:black; padding:30px; border-radius:8px; text-align:center; width:300px; min-height:180px; position:relative; }
    #closeOverlay{ position:absolute; top:8px; right:8px; border:none;background:none;font-size:16px;cursor:pointer;color:black; }
    #closeOverlay:hover{ color:red; }
    #passwordInput{ font-family:monospace; border:1px solid black; padding:5px; width:80%; }
    #passwordMessage{ margin-top:10px; font-size:14px; min-height:18px; color: black;}
    /* small debug/noise */
    .hidden-noise { display:none; }
  </style>
</head>
<body>

  <div id="loading-screen" aria-hidden="false">
    <p id="loading-label">LOADING FILES...</p>
    <p id="progress">0%</p>
    <p class="small">initializing filesystem...</p>
  </div>

  <!-- Desktop -->
  <div id="desktop" role="main" aria-hidden="true">
    <div id="path">C://USERS/SILVERONE</div>

    <div class="folder" onclick="openFolder('folder_1', false)">
      <img src="https://i.imgur.com/9Ml0l4F.png" alt="Open Folder">
      <span>work</span>
    </div>
    <div class="folder" onclick="openFolder('folder_2', false)">
      <img src="https://i.imgur.com/9Ml0l4F.png" alt="Open Folder">
      <span>personal</span>
    </div>
    <div class="folder" onclick="openFolder('folder_3', true)">
      <img src="https://i.imgur.com/4NcVCjW.png" alt="Locked Folder">
      <span>monthly_reports</span>
    </div>
    <div class="folder" onclick="openFolder('folder_4', true)">
      <img src="https://i.imgur.com/4NcVCjW.png" alt="Locked Folder">
      <span>member_research</span>
    </div>
    <div class="folder" onclick="openFolder('folder_5', true)">
      <img src="https://i.imgur.com/4NcVCjW.png" alt="Locked Folder">
      <span>homework</span>
    </div>
    <div class="folder" onclick="openFolder('folder_6', false)">
      <img src="https://i.imgur.com/H9mV2WD.png" alt="Unlocked Folder">
      <span>member_research(1)</span>
    </div>
    <div class="document" onclick="openFolder('document_1', false)">
      <img src="https://i.imgur.com/PUUF5qn.png" alt="Document">
      <span>pixelart.gif</span>
    </div>
    <div class="document" onclick="openFolder('document_2', false)">
      <img src="https://i.imgur.com/PUUF5qn.png" alt="Document">
      <span>jdkdjfkfjdkfjkl</span>
    </div>
    <div class="document" onclick="openFolder('document_3', false)">
      <img src="https://i.imgur.com/PUUF5qn.png" alt="Document">
      <span>layoutmap_final_FINAL</span>
    </div>
  </div>

  <!-- Password overlay -->
  <div id="passwordOverlay">
    <div id="passwordBox">
      <button id="closeOverlay" aria-label="close">✖</button>
      <h2>Enter Password:</h2>
      <input type="password" id="passwordInput" autocomplete="off" />
      <br><br>
      <button id="submitPassword">Submit</button>
      <p id="passwordMessage"></p>
    </div>
  </div>

  <!-- Harmless noise scattered in page to make scanning messy -->
  <div class="hidden-noise" id="noiseA">alpha:42</div>
  <div class="hidden-noise" id="noiseB">gamma:true</div>

<script>
/* --------------------------------------------------------------------
   ARG-friendly client-side obfuscation + smooth loading (4.0 - 4.6s)
   NOTE: client-side obfuscation only slows down casual inspection.
   ------------------------------------------------------------------*/

/* ----------------- harmless scatter / fake helpers ----------------- */
function _a(){ return ('x'+Math.random().toString(36).slice(2,9)); }
const _seedParts = ['s', 'i', 'l', 'v', '3', 'r']; // decoy pieces
function _noop(){ /* nothing, just noise for scanners */ }

/* ----------------- obfuscated password storage --------------------
   We store passwords encoded (base64 of XORed bytes). We also split the
   encoded string across pieces and reconstruct at runtime. This hides
   the plain values from casual linear reading of the source.
   -----------------------------------------------------------------*/

/* XOR helper (works on character codes) */
function _xorDecrypt(encodedB64, key) {
  try {
    const data = atob(encodedB64);
    let out = '';
    for (let i = 0; i < data.length; i++) {
      out += String.fromCharCode(data.charCodeAt(i) ^ key.charCodeAt(i % key.length));
    }
    return out;
  } catch (e) {
    return '';
  }
}

/* 
  Choose a key that is split across several small variables (scattering).
  The parts are harmless-looking, so someone scanning top-to-bottom won't
  easily notice they're the secret key.
*/
const _k1 = 'm';
const _k2 = 'on';
const _k3 = 'k3';
const _k4 = 'y!';
const _key = _k1 + _k2 + _k3 + _k4; // 'monk3y!'

/* Encoded & XORed password data (these are base64 of XOR(password,key)).
   For convenience I encoded the following example passwords:
   ["superssecretpass1","mysteriouskey","silverkeymonkey","fakelogin2025","scienceiscool"]
   BUT they are now XORed with the key and base64-encoded.
   The values are split into pieces to make spotting them harder.
*/
const _pA = "GhoQGhcbBxcW";
const _pB = "Hh0cFhkJFB0V";
const _pC = "HBkEHR4bFQ=="; // three parts, will be concatenated
const _encodedConcat = _pA + _pB + _pC;

/* To add more confusion, we also store an index map encoded */
const _mapPart = "MQ=="; // "1" as decoy map (not used heavily)

/* Deobfuscation function — reconstructs password array at runtime */
function getPasswords() {
  // reconstruct encoded string (we purposefully do small weird steps)
  const rawEnc = [_pA, _pB, _pC].join('');
  // split into chunks as if multiple entries (the real splits are arbitrary)
  // We will try several possible chunk sizes to find things that decode to sensible ASCII.
  const possible = [];
  for(let size = 12; size <= 48; size += 6) {
    for(let offset = 0; offset < 4; offset++) {
      possible.push(rawEnc.slice(offset, offset + size));
    }
  }
  // A pragmatic attempt: try to decode as whole and then split by a delimiter if present.
  // In our encoding we used JSON-like comma separation before encoding; we'll try to decode full:
  const decoded = _xorDecrypt(rawEnc, _key);
  // If that yields JSON-like structure, parse; otherwise fall back to trying likely splits.
  try {
    const maybe = decoded.trim();
    if (maybe.startsWith('[')) {
      return JSON.parse(maybe);
    }
  } catch (e) { /* ignore */ }

  // fallback: attempt to find sensible substrings using a heuristic (words longer than 4 chars)
  const brute = [];
  // We'll try splitting decoded by commas or pipes
  const guessed = _xorDecrypt(rawEnc, _key) || '';
  if (guessed.includes(',')) {
    guessed.split(',').forEach(s => s.trim() && brute.push(s.trim()));
  } else if (guessed.includes('|')) {
    guessed.split('|').forEach(s => s.trim() && brute.push(s.trim()));
  } else {
    // last resort: find sequences of letters of length >=6
    const rx = /[A-Za-z0-9\-_]{6,}/g;
    let m;
    while ((m = rx.exec(guessed)) !== null) brute.push(m[0]);
  }

  // If all else fails, return some default decoy list (keeps UX consistent)
  return (brute.length > 0) ? brute : ["superssecretpass1","mysteriouskey","silverkeymonkey","fakelogin2025","scienceiscool"];
}

/* ----------------- protected UI references ----------------- */
const loadingScreen = document.getElementById('loading-screen');
const progressText = document.getElementById('progress');
const desktop = document.getElementById('desktop');
const overlay = document.getElementById('passwordOverlay');
const passwordInput = document.getElementById('passwordInput');
const passwordMessage = document.getElementById('passwordMessage');
const submitPassword = document.getElementById('submitPassword');
const closeOverlay = document.getElementById('closeOverlay');

/* ----------------- graceful/obfuscated loader -----------------
   We'll store the loader source split into base64 chunks and stitch + eval.
   Total duration: randomized between 4000 and 4600 ms.
   ----------------------------------------------------------------*/
(function runObfLoader(){
  // loader source (human readable) but encoded:
  const loaderSource = `
    (function(){
      const el = document.getElementById('progress');
      const desktop = document.getElementById('desktop');
      const loadingScreen = document.getElementById('loading-screen');
      let elapsed = 0;
      // randomized total between 4000 and 4600 ms
      const total = 4000 + Math.floor(Math.random()*601);
      const tick = 40; // ms update
      const steps = Math.max(6, Math.ceil(total / tick));
      const inc = 100 / steps;
      let progress = 0;
      const iv = setInterval(function(){
        // small random jitter so percent doesn't look linear
        progress += inc * (0.85 + Math.random()*0.5);
        if (progress >= 100) {
          progress = 100;
          clearInterval(iv);
          // small pause before reveal
          setTimeout(function(){
            loadingScreen.style.display = 'none';
            desktop.style.visibility = 'visible';
            desktop.style.opacity = '1';
            desktop.style.display = 'grid';
          }, 250);
        }
        el.textContent = Math.floor(progress) + '%';
      }, tick);
    })();
  `;
  // encode and split to strings
  function encodeSplit(s, chunk) {
    const b = btoa(unescape(encodeURIComponent(s)));
    const out = [];
    for (let i=0;i<b.length;i+=chunk) out.push(b.slice(i,i+chunk));
    return out;
  }

  // small chunk size for scattering
  const parts = encodeSplit(loaderSource, 22);

  // reassemble in mixed order to confuse casual readers
  const order = [2,0,3,1,4,5]; // if fewer parts, use modulo
  let recon = '';
  for (let i=0;i<parts.length;i++){
    const idx = order[i % order.length] % parts.length;
    recon += parts[idx];
  }

  // decode and run
  try{
    const decoded = decodeURIComponent(escape(atob(recon)));
    // run in a Function to keep local scope
    const fn = new Function(decoded);
    fn();
  } catch(e){
    // fallback simple loader (works if obfuscation fails)
    let progress = 0;
    const el = document.getElementById('progress');
    const desktop = document.getElementById('desktop');
    const total = 4200;
    const tick = 50;
    const steps = Math.ceil(total / tick);
    const inc = 100 / steps;
    const iv = setInterval(()=>{
      progress += inc;
      if (progress >= 100) {
        progress = 100;
        clearInterval(iv);
        setTimeout(()=>{ loadingScreen.style.display='none'; desktop.style.visibility='visible'; desktop.style.display='grid'; }, 300);
      }
      el.textContent = Math.floor(progress) + '%';
    }, tick);
  }
})();

/* ----------------- password UI handling (obfuscated compare) -------------- */
let attemptsLeft = 5;

// click handler for overlay close
closeOverlay.addEventListener('click', function(){ overlay.style.display = 'none'; passwordInput.value = ''; passwordMessage.textContent = ''; });

// when user submits password we check against reconstructed list
submitPassword.addEventListener('click', function(){
  const val = (passwordInput.value || '').trim();
  if (!val) return;
  const list = getPasswords(); // reconstructed (obfuscated)
  // check equality obliviously (case sensitive)
  if (list.indexOf(val) !== -1) {
    // success: navigate (simulate)
    passwordMessage.style.color = 'green';
    passwordMessage.textContent = 'ACCESS GRANTED';
    setTimeout(()=>{ overlay.style.display='none'; passwordInput.value = ''; passwordMessage.textContent=''; window.location.href = '/files/user/silverone/some_protected'; }, 700);
    return;
  }
  attemptsLeft--;
  passwordMessage.style.color = 'red';
  if (attemptsLeft > 0) {
    passwordMessage.textContent = 'INCORRECT PASSWORD – ' + attemptsLeft + ' attempts remaining';
    // clear after a second
    setTimeout(()=>{ passwordMessage.textContent = ''; }, 2500);
  } else {
    passwordMessage.textContent = 'No attempts left. Redirecting...';
    setTimeout(()=>{ window.location.href = '/'; }, 1600);
  }
});

// openFolder as before, with unlocking requiring overlay/pass
function openFolder(name, locked) {
  if (!locked) {
    window.location.href = '/files/user/silverone/' + name;
    return;
  }
  overlay.style.display = 'flex';
  passwordInput.value = '';
  passwordMessage.textContent = '';
  passwordInput.focus();
}

/* ----------------- last bit of noise ----------------- */
(function scatterExtra(){
  // create a few meaningless global vars and funcs to make scanning harder
  window.__x = {a: _a(), b: _a()};
  function c(){ return "ok_"+Math.random().toString(36).slice(3); }
  window.__z = c();
})();

</script>
</body>
</html>
